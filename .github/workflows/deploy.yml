name: Deploy to GitHub Pages

# Builds the SvelteKit static site and publishes it to the `deploy` branch,
# which GitHub Pages serves at justheatherbree.com/lifegraph/.
# Runs on every push to main (e.g. after editing data via the local /admin tool
# and committing the JSON), or manually from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/build
          publish_branch: deploy
          # Replace the branch with a single clean commit each time (no artifact history bloat).
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
